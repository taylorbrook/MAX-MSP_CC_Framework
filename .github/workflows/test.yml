name: Tests

on:
  push:
    # Branches only: tag pushes run these tests through release.yml instead.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted 3.10 is the YAML float 3.1.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Parallel via pytest.ini addopts (-n auto = runner core count, pytest-xdist from
      # requirements-dev.txt). `python -m pytest -q -n 0` runs the suite serially.
      - name: Run tests
        run: python -m pytest -q

      # Python 3.10 is the floor. A 3.11+ API (math.exp2, review BL-01) passes
      # the 3.10 leg when no test reaches it; vermin checks every file.
      - name: Check Python 3.10 compatibility (vermin)
        run: |
          python -m pip install "vermin>=1.6,<2"
          vermin -t=3.10- --violations --no-tips --eval-annotations src tools tests scripts .claude/scripts

# Maintainer test config (export-ignored: release archives ship no tests).
#
# The suite runs in parallel by default on pytest-xdist workers (one per core).
#   python3 -m pytest -q                  parallel (this file's -n auto)
#   python3 -m pytest -q -n 0             serial, xdist still loaded
#   python3 -m pytest -q -o addopts=      serial, works without xdist installed
#   PYTEST_XDIST_AUTO_NUM_WORKERS=4 ...   caps the worker count for -n auto
#   python3 -m pytest --pdb ...           debugging: xdist forces -n 0 under --pdb
# Use -n 0 for quick single-file runs (skips the worker-pool start-up).
# Markers are registered in tests/conftest.py.
[pytest]
addopts = -n auto
